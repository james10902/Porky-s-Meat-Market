[build]
  functions = "netlify/functions"
  publish   = "."

# Route /api/* calls to Netlify Functions
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Let actual .html files be served directly — don't rewrite them
[[redirects]]
  from   = "/*.html"
  to     = "/:splat.html"
  status = 200

# SPA fallback for everything else
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[functions]
  node_bundler            = "esbuild"
  external_node_modules   = ["pg", "bcryptjs", "jsonwebtoken"]
