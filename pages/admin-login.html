<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Porky's Meat Market</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #0d0d0d;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-family-primary, 'Inter', sans-serif);
      padding: 1.5rem;
    }
    .wrap { width: 100%; max-width: 440px; }
    .back-top { display:inline-block; color:rgba(255,255,255,0.4); font-size:0.8rem; text-decoration:none; margin-bottom:1rem; }
    .back-top:hover { color:rgba(255,255,255,0.8); }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.6);
    }
    .logo-row { display:flex; align-items:center; gap:0.75rem; margin-bottom:2rem; }
    .logo-row img { width:44px; height:44px; border-radius:50%; object-fit:cover; border:2px solid rgba(245,166,35,0.4); }
    .logo-name { font-size:0.875rem; font-weight:700; color:#f2f2f2; letter-spacing:0.04em; text-transform:uppercase; display:block; }
    .logo-sub  { font-size:0.7rem; color:#F5A623; letter-spacing:0.1em; text-transform:uppercase; display:block; }
    .lock { font-size:2.5rem; display:block; margin-bottom:1rem; }
    h1 { font-size:1.5rem; font-weight:900; color:#f2f2f2; margin:0 0 0.35rem; }
    .subtitle { font-size:0.875rem; color:#777; margin:0 0 1.5rem; }

    /* Tabs */
    .tabs { display:flex; border-bottom:1px solid #2a2a2a; margin-bottom:1.5rem; }
    .tab-btn {
      flex:1; background:none; border:none; padding:0.75rem; font-size:0.85rem; font-weight:600;
      color:#555; cursor:pointer; border-bottom:2px solid transparent; transition:all 0.2s;
      font-family:inherit; letter-spacing:0.04em; text-transform:uppercase;
    }
    .tab-btn.active { color:#F5A623; border-bottom-color:#F5A623; }

    /* Panels */
    .panel { display:none; }
    .panel.active { display:block; }

    /* Alert */
    .alert {
      padding:0.75rem 1rem; border-radius:8px; font-size:0.875rem; margin-bottom:1rem;
      border-left:3px solid #E74C3C; background:rgba(231,76,60,0.1); color:#E74C3C; display:none;
    }
    .alert.success { border-color:#27AE60; background:rgba(39,174,96,0.1); color:#27AE60; }

    /* Form */
    .form-group { margin-bottom:1.1rem; }
    .form-group label { display:block; font-size:0.8rem; font-weight:600; color:#aaa; margin-bottom:0.4rem; letter-spacing:0.04em; text-transform:uppercase; }
    .form-group input {
      width:100%; background:#202020; border:1.5px solid #383838; color:#f2f2f2;
      border-radius:8px; padding:0.75rem 1rem; font-size:0.9rem; font-family:inherit;
      transition:border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus { outline:none; border-color:#F5A623; box-shadow:0 0 0 3px rgba(245,166,35,0.12); }
    .form-group input::placeholder { color:#555; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }

    /* Submit button */
    .submit-btn {
      width:100%; background:#F5A623; color:#0d0d0d; border:none; border-radius:8px;
      padding:0.85rem 1.5rem; font-family:inherit; font-size:0.875rem; font-weight:700;
      letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
      transition:background 0.2s, transform 0.15s; margin-top:0.5rem;
      display:flex; align-items:center; justify-content:center; gap:0.5rem;
    }
    .submit-btn:hover { background:#FFD166; transform:translateY(-1px); }
    .submit-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
    .spinner {
      width:16px; height:16px; border:2px solid rgba(0,0,0,0.25); border-top-color:#0d0d0d;
      border-radius:50%; animation:spin 0.7s linear infinite; display:none;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .card-footer { text-align:center; margin-top:1.5rem; }
    .card-footer a { font-size:0.8rem; color:#555; text-decoration:none; }
    .card-footer a:hover { color:#aaa; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="back-top">← Back to site</a>
    <div class="card">

      <div class="logo-row">
        <img src="/assets/Images/Porky logo.jpg" alt="Porky's Meat Market">
        <div>
          <span class="logo-name">Porky's Meat Market</span>
          <span class="logo-sub">Admin Portal</span>
        </div>
      </div>

      <span class="lock">🔐</span>
      <h1>Admin Portal</h1>
      <p class="subtitle">Sign in or create your admin account.</p>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-signin" onclick="switchTab('signin')">Sign In</button>
        <button class="tab-btn" id="tab-create" onclick="switchTab('create')">Create Account</button>
      </div>

      <!-- ── SIGN IN PANEL ── -->
      <div class="panel active" id="panel-signin">
        <div class="alert" id="signin-alert"></div>
        <form id="signin-form" novalidate>
          <div class="form-group">
            <label for="signin-email">Email Address</label>
            <input type="email" id="signin-email" placeholder="admin@porkysmm.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label for="signin-password">Password</label>
            <input type="password" id="signin-password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="submit-btn" id="signin-btn">
            <span id="signin-btn-text">SIGN IN TO ADMIN</span>
            <span class="spinner" id="signin-spinner"></span>
          </button>
        </form>
      </div>

      <!-- ── CREATE ACCOUNT PANEL ── -->
      <div class="panel" id="panel-create">
        <div class="alert" id="create-alert"></div>
        <form id="create-form" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="create-firstname">First Name</label>
              <input type="text" id="create-firstname" placeholder="John" required>
            </div>
            <div class="form-group">
              <label for="create-lastname">Last Name</label>
              <input type="text" id="create-lastname" placeholder="Smith" required>
            </div>
          </div>
          <div class="form-group">
            <label for="create-email">Email Address</label>
            <input type="email" id="create-email" placeholder="admin@porkysmm.com" required>
          </div>
          <div class="form-group">
            <label for="create-password">Password</label>
            <input type="password" id="create-password" placeholder="Min. 8 characters" required minlength="8">
          </div>
          <div class="form-group">
            <label for="create-confirm">Confirm Password</label>
            <input type="password" id="create-confirm" placeholder="Repeat password" required>
          </div>
          <button type="submit" class="submit-btn" id="create-btn">
            <span id="create-btn-text">CREATE ADMIN ACCOUNT</span>
            <span class="spinner" id="create-spinner"></span>
          </button>
        </form>
      </div>

      <div class="card-footer">
        <a href="/">← Back to Porky's Meat Market</a>
      </div>
    </div>
  </div>

  <script src="/js/utils/dom.js"></script>
  <script src="/js/services/api.js"></script>
  <script src="/js/modules/auth.js"></script>
  <script>
    /* ── Tab switching ── */
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    }

    /* ── Alert helpers ── */
    function showAlert(id, msg, type) {
      const el = document.getElementById(id);
      if (!el) return;
      el.textContent = msg;
      el.className = 'alert' + (type === 'success' ? ' success' : '');
      el.style.display = 'block';
    }
    function hideAlert(id) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }

    /* ── Loading state ── */
    function setLoading(btnId, textId, spinnerId, on) {
      const btn = document.getElementById(btnId);
      const txt = document.getElementById(textId);
      const sp  = document.getElementById(spinnerId);
      if (btn) btn.disabled = on;
      if (txt) txt.style.display = on ? 'none' : '';
      if (sp)  sp.style.display  = on ? 'inline-block' : 'none';
    }

    /* ── Encode password ── */
    function encode(str) { return btoa(unescape(encodeURIComponent(str))); }

    document.addEventListener('DOMContentLoaded', () => {

      /* If already signed in as admin, go to dashboard */
      try {
        const session = JSON.parse(localStorage.getItem('porky_admin_session'));
        const force   = new URLSearchParams(window.location.search).get('force');
        if (session && session.role === 'admin' && !force) {
          window.location.href = '/pages/admin.html';
          return;
        }
        if (force) localStorage.removeItem('porky_admin_session');
      } catch(e) {}

      /* ── SIGN IN ── */
      document.getElementById('signin-form').addEventListener('submit', (e) => {
        e.preventDefault();
        hideAlert('signin-alert');

        const email    = document.getElementById('signin-email').value.trim();
        const password = document.getElementById('signin-password').value;

        if (!email || !password) {
          showAlert('signin-alert', 'Please enter your email and password.');
          return;
        }

        setLoading('signin-btn', 'signin-btn-text', 'signin-spinner', true);

        try {
          const users = JSON.parse(localStorage.getItem('porky_users') || '[]');
          const user  = users.find(u => u.email.toLowerCase() === email.toLowerCase());

          if (!user) {
            showAlert('signin-alert', 'No account found with this email.');
            return;
          }
          if (user._pw !== encode(password)) {
            showAlert('signin-alert', 'Incorrect password. Please try again.');
            return;
          }
          if (user.role !== 'admin') {
            showAlert('signin-alert', 'This account does not have admin privileges.');
            return;
          }

          /* Save to admin session key */
          const session = { ...user };
          delete session._pw;
          localStorage.setItem('porky_admin_session', JSON.stringify(session));

          showAlert('signin-alert', '✅ Signed in! Redirecting…', 'success');
          setTimeout(() => { window.location.href = '/pages/admin.html'; }, 700);

        } catch(err) {
          showAlert('signin-alert', 'Something went wrong. Please try again.');
        } finally {
          setLoading('signin-btn', 'signin-btn-text', 'signin-spinner', false);
        }
      });

      /* ── CREATE ACCOUNT ── */
      document.getElementById('create-form').addEventListener('submit', (e) => {
        e.preventDefault();
        hideAlert('create-alert');

        const firstname = document.getElementById('create-firstname').value.trim();
        const lastname  = document.getElementById('create-lastname').value.trim();
        const email     = document.getElementById('create-email').value.trim();
        const password  = document.getElementById('create-password').value;
        const confirm   = document.getElementById('create-confirm').value;

        if (!firstname || !lastname || !email || !password) {
          showAlert('create-alert', 'Please fill in all fields.'); return;
        }
        if (password.length < 8) {
          showAlert('create-alert', 'Password must be at least 8 characters.'); return;
        }
        if (password !== confirm) {
          showAlert('create-alert', 'Passwords do not match.'); return;
        }

        setLoading('create-btn', 'create-btn-text', 'create-spinner', true);

        try {
          const users = JSON.parse(localStorage.getItem('porky_users') || '[]');

          if (users.find(u => u.role === 'admin')) {
            showAlert('create-alert', 'An admin account already exists. Please sign in.');
            return;
          }
          if (users.find(u => u.email.toLowerCase() === email.toLowerCase())) {
            showAlert('create-alert', 'That email is already registered.');
            return;
          }

          const admin = {
            id:        Date.now(),
            firstname: firstname,
            lastname:  lastname,
            name:      firstname + ' ' + lastname,
            email:     email.toLowerCase(),
            phone:     '',
            role:      'admin',
            createdAt: new Date().toISOString(),
            _pw:       encode(password)
          };

          users.push(admin);
          localStorage.setItem('porky_users', JSON.stringify(users));

          /* Sign in immediately */
          const session = { ...admin };
          delete session._pw;
          localStorage.setItem('porky_admin_session', JSON.stringify(session));

          showAlert('create-alert', '✅ Admin account created! Redirecting…', 'success');
          setTimeout(() => { window.location.href = '/pages/admin.html'; }, 800);

        } catch(err) {
          showAlert('create-alert', 'Something went wrong. Please try again.');
        } finally {
          setLoading('create-btn', 'create-btn-text', 'create-spinner', false);
        }
      });
    });
  </script>
</body>
</html>
