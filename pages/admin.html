<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin Panel — Porky's Meat Market">
  <title>Admin Panel — Porky's Meat Market</title>
  <link rel="stylesheet" href="/css/design-system.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages/admin.css">
</head>
<body class="admin-body">

  <!-- Admin Header -->
  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-brand">
        <img src="/assets/Images/Porky logo.jpg" alt="Porky's" class="admin-logo">
        <div>
          <div class="admin-brand-name">Porky's Meat Market</div>
          <div class="admin-brand-sub">Owner Dashboard</div>
        </div>
      </div>
      <div class="admin-header-right">
        <span id="admin-user-name" class="admin-user-name"></span>
        <a href="/" class="btn btn-secondary btn-sm">← View Site</a>
        <button onclick="Admin.logout()" class="btn btn-danger btn-sm">Sign Out</button>
      </div>
    </div>
  </header>

  <!-- Admin Layout -->
  <div class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <nav class="admin-nav">
        <button class="admin-nav-item active" data-section="overview" onclick="Admin.showSection('overview', this)">
          <span>📊</span> Overview
        </button>
        <button class="admin-nav-item" data-section="orders" onclick="Admin.showSection('orders', this)">
          <span>📦</span> Orders
        </button>
        <button class="admin-nav-item" data-section="users" onclick="Admin.showSection('users', this)">
          <span>👥</span> Customers
        </button>
        <button class="admin-nav-item" data-section="messages" onclick="Admin.showSection('messages', this)">
          <span>✉️</span> Messages
          <span class="admin-badge" id="unread-badge" style="display:none;"></span>
        </button>
        <button class="admin-nav-item" data-section="wholesale" onclick="Admin.showSection('wholesale', this)">
          <span>🏭</span> Wholesale Quotes
        </button>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">

      <!-- ── OVERVIEW ── -->
      <section id="section-overview" class="admin-section active">
        <div class="admin-section-header">
          <h1>Overview</h1>
          <button onclick="Admin.loadOverview()" class="btn btn-secondary btn-sm">↻ Refresh</button>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="stats-grid">
          <div class="stat-card loading"><div class="spinner"></div></div>
          <div class="stat-card loading"><div class="spinner"></div></div>
          <div class="stat-card loading"><div class="spinner"></div></div>
          <div class="stat-card loading"><div class="spinner"></div></div>
        </div>

        <!-- Revenue Cards -->
        <div class="revenue-grid" id="revenue-grid"></div>

        <!-- Recent Orders -->
        <div class="admin-card">
          <div class="admin-card-header">
            <h3>Recent Orders</h3>
            <button onclick="Admin.showSection('orders', document.querySelector('[data-section=orders]'))" class="btn btn-secondary btn-sm">View All</button>
          </div>
          <div id="recent-orders-table"></div>
        </div>

        <!-- Status Breakdown -->
        <div class="admin-card">
          <div class="admin-card-header"><h3>Order Status Breakdown</h3></div>
          <div id="status-breakdown" class="status-breakdown"></div>
        </div>
      </section>

      <!-- ── ORDERS ── -->
      <section id="section-orders" class="admin-section">
        <div class="admin-section-header">
          <h1>All Orders</h1>
          <div class="admin-filters">
            <select id="order-status-filter" onchange="Admin.loadOrders()" class="admin-select">
              <option value="">All Statuses</option>
              <option value="PENDING">Pending</option>
              <option value="CONFIRMED">Confirmed</option>
              <option value="IN_COLD_STORAGE">In Cold Storage</option>
              <option value="OUT_FOR_DELIVERY">Out for Delivery</option>
              <option value="DELIVERED">Delivered</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
            <button onclick="Admin.loadOrders()" class="btn btn-secondary btn-sm">↻ Refresh</button>
          </div>
        </div>
        <div class="admin-card">
          <div id="orders-table-container"><div class="admin-loading"><div class="spinner"></div></div></div>
          <div id="orders-pagination" class="admin-pagination"></div>
        </div>
      </section>

      <!-- ── CUSTOMERS ── -->
      <section id="section-users" class="admin-section">
        <div class="admin-section-header">
          <h1>Customers</h1>
          <div class="admin-filters">
            <input type="text" id="user-search" placeholder="Search by name or email…" oninput="Admin.searchUsers()" class="admin-search">
            <button onclick="Admin.loadUsers()" class="btn btn-secondary btn-sm">↻ Refresh</button>
          </div>
        </div>
        <div class="admin-card">
          <div id="users-table-container"><div class="admin-loading"><div class="spinner"></div></div></div>
        </div>
      </section>

      <!-- ── MESSAGES ── -->
      <section id="section-messages" class="admin-section">
        <div class="admin-section-header">
          <h1>Contact Messages</h1>
          <div class="admin-filters">
            <label class="admin-toggle-label">
              <input type="checkbox" id="unread-only" onchange="Admin.loadMessages()"> Unread only
            </label>
            <button onclick="Admin.loadMessages()" class="btn btn-secondary btn-sm">↻ Refresh</button>
          </div>
        </div>
        <div class="admin-card">
          <div id="messages-container"><div class="admin-loading"><div class="spinner"></div></div></div>
        </div>
      </section>

      <!-- ── WHOLESALE ── -->
      <section id="section-wholesale" class="admin-section">
        <div class="admin-section-header">
          <h1>Wholesale Quote Requests</h1>
          <div class="admin-filters">
            <select id="quote-status-filter" onchange="Admin.loadWholesale()" class="admin-select">
              <option value="">All Statuses</option>
              <option value="NEW">New</option>
              <option value="CONTACTED">Contacted</option>
              <option value="QUOTED">Quoted</option>
              <option value="CLOSED">Closed</option>
            </select>
            <button onclick="Admin.loadWholesale()" class="btn btn-secondary btn-sm">↻ Refresh</button>
          </div>
        </div>
        <div class="admin-card">
          <div id="wholesale-container"><div class="admin-loading"><div class="spinner"></div></div></div>
        </div>
      </section>

    </main>
  </div>

  <!-- Order Detail Modal -->
  <div id="order-modal-overlay" class="admin-modal-overlay" onclick="Admin.closeModal()"></div>
  <div id="order-modal" class="admin-modal" role="dialog" aria-modal="true">
    <div class="admin-modal-header">
      <h3 id="modal-title">Order Details</h3>
      <button onclick="Admin.closeModal()" class="admin-modal-close">✕</button>
    </div>
    <div id="modal-body" class="admin-modal-body"></div>
  </div>

  <script src="/js/utils/dom.js" defer></script>
  <script src="/js/services/api.js" defer></script>
  <script src="/js/modules/auth.js" defer></script>
  <script src="/js/modules/admin.js" defer></script>
</body>
</html>
